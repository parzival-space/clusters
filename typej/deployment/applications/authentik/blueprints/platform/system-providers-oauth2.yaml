# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Platform - OAuth2 Provider - Scopes
  labels:
    blueprints.goauthentik.io/description: Provides additional OAuth2 Scope Mappings and extends default Mappings
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      required: true
      identifiers:
        name: System - OAuth2 Provider - Scopes

  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: "authentik default OAuth Mapping: OpenID 'profile'"
    attrs:
      expression: |
        return {
            # Because authentik only saves the user's full name, and has no concept of first and last names,
            # the full name is used as given name.
            # You can override this behaviour in custom mappings, i.e. `request.user.name.split(" ")`
            "name": request.user.name,
            "given_name": request.user.name,
            "preferred_username": request.user.username,
            "nickname": request.user.username,
            "groups": [group.name for group in request.user.ak_groups.all()],
            "picture": request.user.attributes.get("avatar", None),
        }