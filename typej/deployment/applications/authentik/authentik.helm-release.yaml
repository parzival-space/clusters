apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  chart:
    spec:
      chart: authentik
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: authentik
      version: 2025.12.4
  interval: 15m0s
  valuesFrom:
    - kind: ConfigMap
      name: authentik-values
      valuesKey: values.yaml
      optional: false
    - kind: Secret
      name: authentik-secrets
      valuesKey: values.yaml
      optional: false
