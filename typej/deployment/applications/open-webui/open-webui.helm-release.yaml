apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: open-webui
spec:
  interval: 15m0s
  chart:
    spec:
      chart: open-webui
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: open-webui
      version: 12.13.0
  valuesFrom:
    - kind: ConfigMap
      name: open-webui-values
      valuesKey: values.yaml
      optional: false
    - kind: Secret
      name: open-webui-values
      valuesKey: values.yaml
      optional: false
