apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: playwright
spec:
  replicas: 1
  serviceName: playwright
  selector:
    matchLabels:
      app: playwright
  template:
    metadata:
      labels:
        app: playwright
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      restartPolicy: Always
      containers:
        - name: playwright
          image: mcr.microsoft.com/playwright:v1.58.2-noble
          workingDir: /home/pwuser
          command: ["/bin/sh", "-c"]
          args:
            - "npx -y playwright@1.58.2 run-server --port 3000 --host 0.0.0.0"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
              protocol: TCP
              name: playwright-server
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          # Mount a memory-backed tmpfs at /dev/shm to satisfy Chromium's shared memory needs
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
