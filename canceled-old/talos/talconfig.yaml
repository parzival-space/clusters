clusterName: canceled
endpoint: https://canceled.k8s.parzival.space:6443
talosVersion: "v1.12.6"
kubernetesVersion: "v1.35.3"
allowSchedulingOnControlPlanes: true
additionalApiServerCertSans:
  - canceled.k8s.parzival.space
additionalMachineCertSans:
  - canceled.k8s.parzival.space

clusterPodNets:
  - 10.244.0.0/16
  - fd00:244::/56

clusterSvcNets:
  - 10.96.0.0/12
  - fd00:96::/112

controlPlane:
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          # extensions required for longhorn
          - siderolabs/iscsi-tools
          - siderolabs/util-linux-tools
  patches:
    - |-
      machine:
        # extra mount for longhorn
        kubelet:
          extraMounts:
          - destination: /var/lib/longhorn
            type: bind
            source: /var/lib/longhorn
            options:
              - bind
              - rshared
              - rw
        # increase the number of hugepages for longhorn
        sysctls:
          vm.nr_hugepages: "1024"
        # enable the required kernel modules for longhorn
        kernel:
          modules:
            - name: nvme_tcp
            - name: vfio_pci

nodes:
  - hostname: eu-central-1
    controlPlane: true
    ipAddress: eu-central-1.canceled.k8s.parzival.space
    installDisk: /dev/disk/by-path/pci-0000:00:10.0
    certSANs:
      - eu-central-1.canceled.k8s.parzival.space
    machineSpec:
      mode: metal
      arch: amd64
      secureboot: true
      useUKI: true
    nodeLabels:
      topology.kubernetes.io/region: eu
      topology.kubernetes.io/zone: central
    networkInterfaces:
      - interface: ens3
        dhcp: false
        addresses:
          - 193.30.120.10/22
          - 2a03:4000:2a:702::10/64
        routes:
          - network: 0.0.0.0/0
            gateway: 193.30.120.1
          - network: ::/0
            gateway: fe80::1
    nameservers:
      - 1.1.1.1                 # Cloudflare DNS
      - 2606:4700:4700::1111    # Cloudflare DNS
      - 86.54.11.100            # DNS4EU DNS
      - 2a13:1001::86:54:11:100 # DNS4EU DNS
    patches:
      - |-
        machine:
          sysctls:
            # router advertisements are broken in the vms network
            net.ipv6.conf.ens3.accept_ra: "0"
