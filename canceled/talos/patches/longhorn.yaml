machine:
  # extra mount for longhorn
  kubelet:
    extraMounts:
      - destination: /var/lib/longhorn
        type: bind
        source: /var/lib/longhorn
        options:
          - bind
          - rshared
          - rw
  # increase the number of hugepages for longhorn
  sysctls:
    vm.nr_hugepages: "1024"
  # enable the required kernel modules for longhorn
  kernel:
    modules:
      - name: nvme_tcp
      - name: vfio_pci
