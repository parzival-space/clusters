apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pg-admin
spec:
  chart:
    spec:
      chart: pgadmin4
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: runix
      version: "1.62.0"
  interval: 24h0m0s
  valuesFrom:
    - kind: Secret
      name: pg-admin
      valuesKey: values.yaml
  values:
    ingress:
      enabled: false # we don't want to expose pg-admin to the internet
