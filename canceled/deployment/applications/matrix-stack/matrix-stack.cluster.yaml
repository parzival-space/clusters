apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: matrix-stack
spec:
  instances: 3

  # storage requirements: 20Gi
  storage:
    size: 50Gi

  bootstrap:
    initdb:
      # encoding requirements:
      # https://docs.element.io/latest/element-server-suite-classic/requirements-and-recommendations/#kubernetes-postgresql
      locale: 'C'
      encoding: 'UTF8'

      owner: matrix_stack
      database: matrix_synapse

      postInitSQL:
        - CREATE DATABASE matrix_authentication_service WITH OWNER matrix_stack ENCODING 'UTF8' LOCALE 'C' TEMPLATE template0;
