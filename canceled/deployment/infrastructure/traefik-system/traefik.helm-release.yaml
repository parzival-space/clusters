apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  chart:
    spec:
      chart: traefik
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: traefik
      version: "39.0.6"
  interval: 24h0m0s
  values:
    ports:
      web:
        port: 80
        nodePort: 80
      websecure:
        port: 443
        nodePort: 443

