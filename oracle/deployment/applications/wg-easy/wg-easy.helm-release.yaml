apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: wg-easy
  namespace: wg-easy
spec:
  interval: 10m
  chart:
    spec:
      chart: wg-easy
      sourceRef:
        kind: HelmRepository
        name: wg-easy
        namespace: wg-easy
      verify:
        provider: cosign # Enable signature verification
  values:
    config:
      init:
        existingSecret: "wg-easy"
        host: "a1flex-server1.oracle.cluster.parzival.space"
    serviceMonitor:
      create: false
    service:
      ui:
        type: ClusterIP
      wireguard:
        type: ClusterIP
    storage:
      storageClass: "longhorn"
