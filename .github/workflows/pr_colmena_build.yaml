name: Verify Colmena Build on PR

on:
  pull_request:
    paths:
      - ./*/nix/**
  workflow_dispatch:

jobs:
  colmena-build:
    strategy:
      matrix:
        cluster:
          - edge
    name: Colmena Build for '${{ matrix.cluster }}' Cluster
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '1'

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          enable_kvm: 'true'

      - name: Print nixpkgs version
        run: nix-instantiate --eval -E '(import <nixpkgs> {}).lib.version'

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: colmena

      - name: Print Colmena Version
        run: nix run github:zhaofengli/colmena --extra-experimental-features "nix-command flakes" -- --version

      - name: Build Colmena Configuration
        id: build
        working-directory: ./${{ matrix.cluster }}/nix
        continue-on-error: true
        run: |
          nix run github:zhaofengli/colmena --extra-experimental-features "nix-command flakes" -- build |& tee build-${{ matrix.cluster }}.log

          # if log does not contain "All done!", consider it a success
          if grep -q "All done!" build-${{ matrix.cluster }}.log; then
              echo "Build succeeded"
              echo "success=1" >> $GITHUB_OUTPUT
          else
              echo "Build failed"
              echo "success=0" >> $GITHUB_OUTPUT
          fi

      - name: Publish Report
        uses: actions/github-script@v8
        env:
          RESULT: "${{ steps.build.outputs.success == '1' && 'success' || 'failure' }}"
          TITLE: "Results for Colmena Build - ${{ matrix.cluster }} Cluster"
          SUMMARY_SUCCESS: "Colmena build completed successfully."
          SUMMARY_FAILURE: "Colmena build failed. Please check the logs for details."
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: process.env.TITLE,
              head_sha: process.env.SHA,
              status: "completed",
              conclusion: process.env.RESULT,
              output: {
                title: process.env.TITLE,
                summary: process.env.RESULT === 'success' ? process.env.SUMMARY_SUCCESS : process.env.SUMMARY_FAILURE
              }
            });
