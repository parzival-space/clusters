name: Verify Colmena Build on PR

on:
  pull_request:
  workflow_dispatch:

jobs:
  colmena-build:
    strategy:
      matrix:
        cluster:
          - edge
    name: Colmena Build for '${{ matrix.cluster }}' Cluster
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '1'

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          enable_kvm: 'true'

      - name: Print nixpkgs version
        run: nix-instantiate --eval -E '(import <nixpkgs> {}).lib.version'

      - name: Setup Cachix
        uses: cachix/cachix-action@v14
        with:
          name: colmena

      - name: Print Colmena Version
        run: nix run github:zhaofengli/colmena --extra-experimental-features "nix-command flakes" -- --version

      - name: Build Colmena Configuration
        id: build
        working-directory: ./${{ matrix.cluster }}/nix
        continue-on-error: true
        run: nix run github:zhaofengli/colmena --extra-experimental-features "nix-command flakes" -- build

      - name: Publish Report
        uses: actions/github-script@v7
        env:
          SUCCESS: ${{ steps.build.exitcode == 0 }}
          TITLE: "Results for Colmena Build - ${{ matrix.cluster }} Cluster"
          SUMMARY_SUCCESS: "Colmena build completed successfully."
          SUMMARY_FAILURE: "Colmena build failed. Please check the logs for details."
        with:
          script: |
            const conclusion = process.env.SUCCESS === 'true' ? 'success' : 'failure';

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: process.env.TITLE,
              head_sha: process.env.SHA,
              status: "completed",
              conclusion: conclusion,
              output: {
                title: process.env.TITLE,
                summary: conclusion === 'success' ? process.env.SUMMARY_SUCCESS : process.env.SUMMARY_FAILURE
              }
            });
