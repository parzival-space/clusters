name: Renovate Bot
on:
  workflow_dispatch:
  schedule:
    # The "*" (#42, asterisk) character has special semantics in YAML, so this
    # string has to be quoted.
    - cron: '0/15 * * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  renovate:
    name: Renovate Bot
    runs-on: ubuntu-latest
    steps:
      - name: Detect repository name
        id: detect_repository_name
        run: echo "value=${GITHUB_REPOSITORY#*/}" >> $GITHUB_OUTPUT
      - name: Get token
        id: get_token
        uses: actions/create-github-app-token@v3
        with:
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ steps.detect_repository_name.outputs.value }}
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.6
        with:
          token: '${{ steps.get_token.outputs.token }}'
        env:
          # enable commit signing
          RENOVATE_PLATFORM_COMMIT: 'true'
          RENOVATE_AUTODISCOVER: 'true'
          RENOVATE_AUTODISCOVER_FILTER: "/${{ github.repository_owner }}\\/${{ steps.detect_repository_name.outputs.value }}/"
